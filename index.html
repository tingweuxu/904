<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>904 班級雲端數位聯絡簿 & 相簿</title>
  <!-- Google Fonts: Noto Sans TC & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 頂部固定導覽列 -->
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="class-badge">904</div>
        <div class="brand-text">
          <h1>九年四班 數位教室</h1>
          <p class="subtitle">AI 智慧聯絡簿 · 雲端即時相簿</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="sync-pill" id="syncStatusPill">
          <span class="pulse-dot"></span>
          <span>LINE AI 已同步 (16:42)</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 手機版與桌面版雙區塊切換導覽 -->
  <nav class="section-tabs-wrapper">
    <div class="container">
      <div class="section-tabs" role="tablist">
        <button class="tab-btn active" data-target="contact-book" role="tab" aria-selected="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>今日聯絡簿</span>
          <span class="tab-count" id="remainingCountBadge">6</span>
        </button>
        <button class="tab-btn" data-target="class-album" role="tab" aria-selected="false">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>班級雲端相簿</span>
          <span class="tab-badge-drive">Drive</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主內容區 -->
  <main class="container main-content">
    
    <!-- ==================== 區塊一：今日聯絡簿（AI 掃描同步區） ==================== -->
    <section id="contact-book" class="tab-section active">
      
      <!-- 日期資訊列 -->
      <div class="date-banner">
        <div class="date-selector">
          <button class="icon-btn" id="prevDayBtn" aria-label="前一天" title="切換前一天紀錄">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="current-date-info">
            <span class="date-label" id="currentDateText">10月26日 (週一)</span>
            <span class="week-tag" id="weekTagText">第 9 週 · 段考前一週</span>
          </div>
          <button class="icon-btn" id="nextDayBtn" aria-label="後一天" title="切換後一天紀錄">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- 進度統計與篩選列 -->
      <div class="homework-toolbar">
        <div class="progress-wrap">
          <div class="progress-text">
            <span>今日自我檢核進度</span>
            <strong id="progressStatusText">已完成 0 / 6 項</strong>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
          </div>
        </div>

        <div class="category-filters" role="group" aria-label="篩選聯絡簿項目">
          <button class="filter-chip active" data-filter="all">全部項目</button>
          <button class="filter-chip" data-filter="homework">📝 各科作業</button>
          <button class="filter-chip" data-filter="exam">💯 考試範圍</button>
          <button class="filter-chip" data-filter="notice">📌 注意事項</button>
        </div>
      </div>

      <!-- 聯絡簿三大卡片清單區 -->
      <div class="cards-grid" id="contactCardsContainer">
        <!-- 由 JS 動態渲染各科作業、考試範圍與注意事項卡片 -->
      </div>

    </section>

    <!-- ==================== 區塊二：班級相簿區（Google 雲端硬碟同步） ==================== -->
    <section id="class-album" class="tab-section">
      
      <!-- 模式 B：Google Drive 原生嵌入視窗（直接同步 12KxLYb0nzy56ZFtsP8CRF4fxdb8XB9Zb） -->
      <div class="drive-iframe-container">
        <div class="iframe-header">
          <span>📂 <strong>904 班雲端照片總資料夾</strong>（即時同步檢視）</span>
          <a href="https://drive.google.com/drive/folders/12KxLYb0nzy56ZFtsP8CRF4fxdb8XB9Zb" target="_blank" rel="noopener" id="rawDriveFolderUrl">在 Google 雲端分頁開啟 ↗</a>
        </div>
        
        <div class="iframe-wrapper">
          <iframe 
            id="googleDriveIframe"
            src="https://drive.google.com/embeddedfolderview?id=12KxLYb0nzy56ZFtsP8CRF4fxdb8XB9Zb#grid" 
            title="904 班 Google Drive 共用相簿嵌入視窗"
            loading="lazy">
          </iframe>

          <!-- 若瀏覽器因安全策略擋住 Iframe 時的友善備援卡片 -->
          <div class="drive-fallback-card">
            <div class="fallback-icon">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <h3>904 班 Google 雲端硬碟共用總相簿</h3>
            <p>Google 雲端硬碟對部分手機瀏覽器與內嵌視窗設有保護機制。若上方未顯示檔案清單，請點擊下方按鈕直接開啟：</p>
            <div class="fallback-btns">
              <a href="https://drive.google.com/drive/folders/12KxLYb0nzy56ZFtsP8CRF4fxdb8XB9Zb" target="_blank" rel="noopener" class="btn-primary">
                🚀 在 Google 雲端硬碟開啟相簿（支援手機隨手上傳）
              </a>
            </div>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- ==================== 圖片點擊放大 Lightbox 燈箱 ==================== -->
  <div class="lightbox-modal" id="lightboxModal" aria-hidden="true" role="dialog" aria-label="相片放大檢視">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    
    <div class="lightbox-topbar">
      <div class="lightbox-counter" id="lightboxCounter">1 / 8</div>
      <div class="lightbox-top-actions">
        <a href="#" target="_blank" rel="noopener" class="lightbox-btn" id="lightboxDownloadBtn" title="在 Google Drive 查看原圖">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
        <button class="lightbox-btn" id="lightboxCloseBtn" aria-label="關閉預覽">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <button class="lightbox-nav prev" id="lightboxPrevBtn" aria-label="上一張照片">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="lightbox-stage">
      <img src="" alt="" class="lightbox-image" id="lightboxImage">
      <div class="lightbox-caption">
        <div class="caption-main">
          <span class="caption-tag" id="lightboxTag">活動紀錄</span>
          <h3 id="lightboxTitle">照片標題</h3>
        </div>
        <p class="caption-meta" id="lightboxMeta">上傳者與日期</p>
      </div>
    </div>

    <button class="lightbox-nav next" id="lightboxNextBtn" aria-label="下一張照片">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- 底部手機版快速切換列 (Bottom Navigation Bar for Mobile) -->
  <nav class="mobile-bottom-nav" aria-label="手機底部導覽列">
    <button class="mobile-nav-item active" data-target="contact-book">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>今日聯絡簿</span>
    </button>
    <button class="mobile-nav-item" data-target="class-album">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span>雲端相簿</span>
    </button>
  </nav>

  <!-- Toast 通知訊息 -->
  <div class="toast-notification" id="toastNotification" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
